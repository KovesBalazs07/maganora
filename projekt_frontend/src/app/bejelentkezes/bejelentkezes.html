<main class="fiok-panel">
  <h1>Bejelentkezés</h1>
  <form [formGroup]="urlap" (ngSubmit)="belepes()">
    <label for="belepes-email">E-mail-cím</label>
    <input id="belepes-email" type="email" formControlName="email" autocomplete="username"
           required maxlength="100">

    <label for="belepes-jelszo">Jelszó</label>
    <input id="belepes-jelszo" type="password" formControlName="jelszo"
           autocomplete="current-password" required minlength="8" maxlength="128">

    @if (hiba()) {
      <p role="alert">{{ hiba() }}</p>
    }
    <button type="submit" [disabled]="kuldes()">
      {{ kuldes() ? 'Bejelentkezés folyamatban…' : 'Bejelentkezés' }}
    </button>
  </form>
  <p>Még nincs fiókod? <a routerLink="/regisztracio">Regisztrálj</a></p>
</main>
