<main class="naptar-oldal">
  <h1>Naptár</h1>
  <section class="naptar" aria-label="Havi naptár">
    <div class="honap-fejlec">
      <button type="button" (click)="honapotValt(-1)" aria-label="Előző hónap">‹</button>
      <h2 aria-live="polite">{{ honapNeve() }}</h2>
      <button type="button" (click)="honapotValt(1)" aria-label="Következő hónap">›</button>
    </div>
    <div class="napok" [attr.aria-label]="honapNeve()">
      @for (napnev of napnevek; track napnev) {
        <span class="napnev">{{ napnev }}</span>
      }
      @for (nap of napok(); track $index) {
        @if (nap !== null) {
          <button type="button" class="nap" [class.ma]="maiNap(nap)"
                  [class.kivalasztott]="kivalasztottNap(nap)"
                  [attr.aria-current]="maiNap(nap) ? 'date' : null"
                  [attr.aria-pressed]="kivalasztottNap(nap)"
                  (click)="napotValaszt(nap)">{{ nap }}</button>
        } @else {
          <span aria-hidden="true"></span>
        }
      }
    </div>
  </section>
</main>
